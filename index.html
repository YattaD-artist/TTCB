<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Roll cho lớp TTCB</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #444444;
      --accent: #c62828;
      --accent-light: #e53935;
      --border-color: #222;
      --border-light: #ccc;
      --shadow-hard: 4px 4px 0 rgba(0,0,0,0.1);
      --overlay-bg: rgba(0,0,0,0.45);
      --primary: #e53935;
      --accent2: #444444;
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: #222;
      --card-radius: 16px;
      --tag-radius: 14px;
      --absent-opacity: 0.75;
    }

    body.dark {
      --bg: #121212;
      --surface: #1e1e1e;
      --text: #e8e8e8;
      --text-secondary: #b0b0b0;
      --accent: #ef4444;
      --accent-light: #f87171;
      --border-color: #555;
      --border-light: #333;
      --shadow-hard: 4px 4px 0 rgba(0,0,0,0.4);
      --overlay-bg: rgba(0,0,0,0.7);
      --primary: #f87171;
      --accent2: #b0b0b0;
      --glass-bg: rgba(30, 30, 30, 0.8);
      --glass-border: #555;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    .theme-toggle {
      position: fixed;
      top: 1.2rem;
      left: 1.5rem;
      background: var(--surface);
      border: 2px solid var(--border-color);
      border-radius: 30px;
      padding: 0.5rem 1rem;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: var(--shadow-hard);
      color: var(--text);
      z-index: 200;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .theme-toggle:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .app {
      width: 100%;
      max-width: 1050px;
      margin-top: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .title {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent);
      text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
    }

    .class-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 700px) {
      .class-grid { grid-template-columns: 1fr 1fr; }
      .title { font-size: 1.9rem; }
    }

    .class-card {
      background: var(--surface);
      border: 2px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 1.8rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: var(--shadow-hard);
      color: var(--text);
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .class-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      background: var(--accent);
      color: white;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    }
    .class-card.card-1 { border-left: 5px solid var(--accent); }
    .class-card.card-2 { border-left: 5px solid var(--primary); }
    .class-card.card-3 { border-left: 5px solid var(--accent2); }
    .class-card.card-4 { border-left: 5px solid var(--border-color); }

    .overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .confirm-box {
      background: var(--surface);
      border: 2px solid var(--border-color);
      border-radius: 22px;
      padding: 2rem;
      text-align: center;
      max-width: 340px;
      width: 90%;
      color: var(--text);
      box-shadow: 6px 6px 0 rgba(0,0,0,0.2);
    }
    .confirm-box h3 { color: var(--accent); font-size: 1.7rem; margin-bottom: 0.4rem; }
    .btn-group { display: flex; gap: 0.8rem; justify-content: center; margin-top: 1.4rem; }
    .btn {
      padding: 0.7rem 1.8rem;
      border-radius: 40px;
      font-weight: 700;
      border: 2px solid var(--border-color);
      cursor: pointer;
      font-size: 0.95rem;
      transition: 0.2s;
      text-transform: uppercase;
    }
    .btn-yes { background: var(--accent); color: white; box-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
    .btn-yes:hover { background: var(--accent-light); }
    .btn-no { background: var(--surface); color: var(--text); }
    .btn-no:hover { background: var(--border-light); }

    .main-popup {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 2px solid var(--border-color);
      border-radius: 28px;
      width: 95%;
      max-width: 1500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
      color: var(--text);
      box-shadow: 6px 6px 0 rgba(0,0,0,0.2);
    }
    .popup-close {
      position: absolute;
      top: 1rem;
      right: 1.2rem;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--accent);
      color: var(--accent);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      z-index: 10;
    }
    .popup-close:hover { background: var(--accent); color: white; }

    .lobby-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 1rem;
      text-align: center;
      color: var(--accent);
    }

    .lobby-layout {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      min-height: 500px;
    }
    @media (max-width: 750px) { .lobby-layout { flex-direction: column; } }

    .lobby-left { flex: 3; display: flex; flex-direction: column; }

    .lobby-main {
      background: var(--surface);
      border-radius: 22px;
      border: 2px dashed var(--border-color);
      position: relative;
      min-height: 450px;
      flex: 1;
      overflow: hidden;
    }

    .roll-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 1.5rem;
    }
    .btn-roll {
      padding: 0.9rem 2rem;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      border: 2px solid var(--border-color);
      cursor: pointer;
      color: white;
      transition: 0.2s;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-pick { background: var(--accent); }
    .btn-pick:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
    .btn-group-roll { background: var(--primary); color: white; }
    .btn-roll:hover { filter: brightness(1.1); transform: translateY(-2px); }

    .lobby-side {
      flex: 1.4;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 180px;
    }
    .absent-area {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 18px;
      padding: 0.8rem;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 0.5rem;
      min-height: 60px;
    }
    .temp-area {
      display: none;
      background: transparent;
      border: none;
      padding: 0;
      justify-content: flex-start;
    }
    .temp-area.visible {
      display: flex;
    }

    .area-label {
      width: 100%;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.2rem;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .student-tag {
      background: var(--surface);
      border: 2px solid var(--border-color);
      border-radius: var(--tag-radius);
      padding: 0.5rem 0.9rem;
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
      white-space: nowrap;
      opacity: var(--absent-opacity);
    }
    .student-tag:hover {
      border-color: var(--accent);
      background: rgba(198,40,40,0.05);
      opacity: 1;
    }

    .draggable-tag {
      position: absolute;
      background: var(--surface);
      border: 2px solid var(--border-color);
      border-radius: var(--tag-radius);
      padding: 0.5rem 0.9rem;
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--text);
      cursor: grab;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.15);
      z-index: 2;
      white-space: nowrap;
      min-width: 60px;
      text-align: center;
      animation: floatTag 3.5s ease-in-out infinite;
    }
    @keyframes floatTag {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .draggable-tag:active { cursor: grabbing; }
    .draggable-tag.dragging {
      animation: none;
      opacity: 0.9;
      z-index: 99;
      box-shadow: 5px 5px 0 rgba(0,0,0,0.3);
      border-color: var(--accent);
    }
    .chosen-highlight {
      background: var(--accent) !important;
      color: white !important;
      border-color: var(--accent) !important;
      z-index: 30;
      font-weight: 700;
      box-shadow: 0 0 28px rgba(198,40,40,0.7);
    }

    .return-btn {
      background: var(--primary);
      color: white;
      border: 2px solid var(--border-color);
      border-radius: 20px;
      padding: 0.5rem 1.2rem;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
      text-transform: uppercase;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .return-btn:hover { filter: brightness(1.1); }

    .group-popup {
      background: var(--surface);
      border: 2px solid var(--border-color);
      border-radius: 24px;
      padding: 2rem;
      max-width: 700px;
      width: 94%;
      color: var(--text);
      box-shadow: 6px 6px 0 rgba(0,0,0,0.2);
      max-height: 85vh;
      overflow-y: auto;
    }
    .group-columns { display: flex; gap: 1.5rem; justify-content: center; margin-top: 1rem; }
    .group-col {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 18px;
      padding: 1rem;
      min-height: 200px;
    }
    .group-col h4 {
      font-size: 1.2rem;
      margin-bottom: 0.8rem;
      text-align: center;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .group-col ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; }
    .group-col li {
      padding: 0.5rem 0.8rem;
      border-radius: 20px;
      background: rgba(0,0,0,0.03);
      font-weight: 500;
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    body.dark .group-col li { background: rgba(255,255,255,0.05); }
    .group-col li.animated {
      opacity: 0;
      transform: translateY(-20px);
      animation: dropIn 0.3s ease forwards;
    }
    @keyframes dropIn { to { opacity: 1; transform: translateY(0); } }
    .first-highlight {
      background: var(--accent) !important;
      color: white;
      font-weight: 700;
      box-shadow: 0 0 14px rgba(198,40,40,0.5);
    }
    .leader-badge {
      font-size: 0.7rem;
      font-weight: 600;
      background: rgba(255,255,255,0.25);
      color: inherit;
      padding: 0.15rem 0.5rem;
      border-radius: 12px;
      letter-spacing: 0.3px;
      margin-left: 0.4rem;
    }
    .btn-reroll-tiny {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 1rem;
      padding: 0.3rem 1.2rem;
      border-radius: 20px;
      font-size: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border-color);
      color: var(--text);
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-reroll-tiny:hover { background: var(--border-light); }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" title="Đổi giao diện">
    <i class="fas fa-adjust"></i>
  </button>
  <div class="app">
    <div class="header">
      <div class="title">Lớp học truyện tranh cho người mới bắt đầu</div>
    </div>
    <div class="class-grid" id="classGrid"></div>
  </div>

  <script>
    (function() {
      const DEFAULT_CLASSES = {
        CB01: ["",""],
        CB02: ["Trần Nhã Uyên",""],
        CB03: ["",""],
        CB04: ["Nguyễn Duy Long","Lê Yến Nhi","Đặng Vĩnh Bảo","Nguyễn Hoàng Quyên","Lê Thị Như Quỳnh"]
      };

      let classData = JSON.parse(localStorage.getItem('comic_yattad_v7')) || JSON.parse(JSON.stringify(DEFAULT_CLASSES));
      function saveData() { localStorage.setItem('comic_yattad_v7', JSON.stringify(classData)); }

      let currentAbsentSet = new Set();

      const classGrid = document.getElementById('classGrid');
      const cardColors = ['card-1','card-2','card-3','card-4'];
      const themeToggle = document.getElementById('themeToggle');

      function applyTheme() {
        if (localStorage.getItem('theme') === 'dark') {
          document.body.classList.add('dark');
        } else {
          document.body.classList.remove('dark');
        }
      }
      themeToggle.addEventListener('click', () => {
        if (document.body.classList.contains('dark')) {
          localStorage.setItem('theme', 'light');
        } else {
          localStorage.setItem('theme', 'dark');
        }
        applyTheme();
      });
      applyTheme();

      function renderClassCards() {
        classGrid.innerHTML = '';
        Object.keys(classData).forEach((name, i) => {
          const card = document.createElement('div');
          card.className = `class-card ${cardColors[i%4]}`;
          card.textContent = name;
          card.addEventListener('click', () => openConfirm(name));
          classGrid.appendChild(card);
        });
      }

      function openConfirm(className) {
        const overlay = document.createElement('div'); overlay.className = 'overlay';
        const box = document.createElement('div'); box.className = 'confirm-box';
        box.innerHTML = `<h3>${className}</h3><p>Mở lớp này?</p>
          <div class="btn-group">
            <button class="btn btn-yes">Mở</button>
            <button class="btn btn-no">Hủy</button>
          </div>`;
        overlay.appendChild(box);
        document.body.appendChild(overlay);
        box.querySelector('.btn-yes').onclick = () => { closeOverlay(overlay); openLobby(className); };
        box.querySelector('.btn-no').onclick = () => closeOverlay(overlay);
        overlay.addEventListener('click', e => { if(e.target === overlay) closeOverlay(overlay); });
      }

      function closeOverlay(ov) { if(ov && ov.parentNode) ov.remove(); }

      function openLobby(className) {
        currentAbsentSet = new Set();

        const overlay = document.createElement('div'); overlay.className = 'overlay';
        const popup = document.createElement('div'); popup.className = 'main-popup';
        popup.innerHTML = `
          <button class="popup-close" id="lobbyClose"><i class="fas fa-times"></i></button>
          <div class="lobby-title">${className}</div>
          <div class="lobby-layout">
            <div class="lobby-left">
              <div class="lobby-main" id="lobbyMain"></div>
              <div class="roll-buttons">
                <button class="btn-roll btn-pick" id="btnPick"><i class="fa-solid fa-user"></i> Người được chọn</button>
                <button class="btn-roll btn-group-roll" id="btnGroup"><i class="fa-solid fa-user-group"></i> Chia nhóm</button>
              </div>
            </div>
            <div class="lobby-side">
              <div class="absent-area" id="absentArea">
                <span class="area-label"><i class="fa-solid fa-user-xmark"></i> Vắng</span>
              </div>
              <div class="temp-area" id="tempArea"></div>
            </div>
          </div>
        `;
        overlay.appendChild(popup);
        document.body.appendChild(overlay);

        const lobbyMain = document.getElementById('lobbyMain');
        const absentArea = document.getElementById('absentArea');
        const tempArea = document.getElementById('tempArea');

        const presentSet = new Set(classData[className]);
        const absentSet = new Set();
        const tempSet = new Set();
        const tagMap = new Map();
        let rollLock = false;
        let pickCompleted = false;
        let pickActive = false;

        const syncAbsent = () => { currentAbsentSet = new Set(absentSet); };

        function rearrangeAllTags() {
          const names = Array.from(presentSet);
          lobbyMain.querySelectorAll('.draggable-tag').forEach(el => el.remove());
          tagMap.clear();
          if (names.length === 0) return;

          const shuffled = shuffle([...names]);
          const containerWidth = lobbyMain.clientWidth;
          const containerHeight = lobbyMain.clientHeight;
          const padding = 20, colGap = 20, rowGap = 14, cols = 3;
          const colWidth = (containerWidth - padding * 2 - colGap * (cols - 1)) / cols;
          const columnHeights = new Array(cols).fill(padding);

          const tagsCopy = [];
          shuffled.forEach(name => {
            const tmp = document.createElement('div'); tmp.className = 'draggable-tag'; tmp.textContent = name;
            tmp.style.visibility = 'hidden'; tmp.style.position = 'absolute'; lobbyMain.appendChild(tmp);
            tagsCopy.push({name, width: tmp.offsetWidth, height: tmp.offsetHeight});
            tmp.remove();
          });

          let totalHeight = 0;
          const colHs = new Array(cols).fill(padding);
          tagsCopy.forEach(t => {
            let minCol = 0;
            for (let i=1;i<cols;i++) if(colHs[i] < colHs[minCol]) minCol = i;
            colHs[minCol] += t.height + rowGap;
          });
          totalHeight = Math.max(...colHs) + padding;
          const verticalOffset = Math.max(0, (containerHeight - totalHeight) / 2);

          const finalColHs = new Array(cols).fill(padding + verticalOffset);
          tagsCopy.forEach(({name, width, height}) => {
            let minCol = 0;
            for (let i=1;i<cols;i++) if(finalColHs[i] < finalColHs[minCol]) minCol = i;
            const left = padding + minCol * (colWidth + colGap) + (colWidth - width) / 2;
            const top = finalColHs[minCol];
            finalColHs[minCol] += height + rowGap;

            const tag = document.createElement('div');
            tag.className = 'draggable-tag';
            tag.textContent = name;
            tag.style.left = left + 'px';
            tag.style.top = top + 'px';
            makeDraggable(tag, lobbyMain);
            tag.addEventListener('click', (e) => {
              if (rollLock || tag.classList.contains('dragging')) return;
              moveToAbsent(name);
            });
            lobbyMain.appendChild(tag);
            tagMap.set(name, { element: tag });
          });
        }

        function moveToAbsent(name) {
          if (rollLock) return;
          const obj = tagMap.get(name);
          if (!obj) return;
          obj.element.remove();
          tagMap.delete(name);
          presentSet.delete(name);
          absentSet.add(name);
          syncAbsent();
          renderAbsentTags();
        }

        function renderAbsentTags() {
          const labels = absentArea.querySelectorAll('.area-label');
          absentArea.innerHTML = '';
          labels.forEach(l => absentArea.appendChild(l));
          absentSet.forEach(name => {
            const tag = document.createElement('div');
            tag.className = 'student-tag';
            tag.textContent = name;
            tag.addEventListener('click', () => {
              absentSet.delete(name);
              presentSet.add(name);
              syncAbsent();
              rearrangeAllTags();
              renderAbsentTags();
            });
            absentArea.appendChild(tag);
          });
        }

        function updateTempVisibility() {
          if (tempSet.size > 0 && pickCompleted) {
            tempArea.classList.add('visible');
            tempArea.innerHTML = '';
            const btn = document.createElement('button');
            btn.className = 'return-btn';
            btn.innerHTML = '<i class="fa-solid fa-user-lock"></i> Hoàn trả danh sách';
            btn.addEventListener('click', () => {
              const names = Array.from(tempSet);
              tempSet.clear();
              names.forEach(n => presentSet.add(n));
              const highlighted = lobbyMain.querySelector('.chosen-highlight');
              if (highlighted) highlighted.classList.remove('chosen-highlight');
              clearResult(className, 'pick');
              pickActive = false;
              pickCompleted = false;
              rearrangeAllTags();
              updateTempVisibility();
              document.getElementById('btnPick').disabled = false;
            });
            tempArea.appendChild(btn);
          } else {
            tempArea.classList.remove('visible');
            tempArea.innerHTML = '';
          }
        }

        rearrangeAllTags();
        syncAbsent();

        document.getElementById('lobbyClose').onclick = () => {
          currentAbsentSet = new Set();
          closeOverlay(overlay);
        };
        overlay.addEventListener('click', e => { if(e.target === overlay) { currentAbsentSet = new Set(); closeOverlay(overlay); } });

        const btnPick = document.getElementById('btnPick');
        btnPick.addEventListener('click', () => {
          if (rollLock || pickActive) return;
          const present = Array.from(presentSet);
          if (present.length === 0) { alert('Không có ai trong sảnh!'); return; }
          const chosen = present[Math.floor(Math.random() * present.length)];
          saveResult(className, 'pick', chosen);
          rollLock = true;
          pickCompleted = false;
          pickActive = true;
          btnPick.disabled = true;
          updateTempVisibility();

          const others = present.filter(n => n !== chosen);
          others.forEach((name, idx) => {
            setTimeout(() => {
              const obj = tagMap.get(name);
              if (obj) {
                obj.element.remove();
                tagMap.delete(name);
                presentSet.delete(name);
                tempSet.add(name);
              }
            }, 600 + idx * (4000 / others.length));
          });

          setTimeout(() => {
            const obj = tagMap.get(chosen);
            if (obj) {
              const el = obj.element;
              el.style.left = (lobbyMain.clientWidth/2 - el.offsetWidth/2) + 'px';
              el.style.top = (lobbyMain.clientHeight/2 - el.offsetHeight/2) + 'px';
              el.classList.add('chosen-highlight');
            }
            rollLock = false;
            pickCompleted = true;
            updateTempVisibility();
          }, 5000);
        });

        document.getElementById('btnGroup').onclick = () => {
          if (rollLock) return;
          const present = Array.from(presentSet);
          if (present.length < 2) { alert('Cần ít nhất 2 người trong sảnh!'); return; }
          openGroupDivision(className, present, absentSet);
        };

        function makeDraggable(el, container) {
          let startX, startY, initialX, initialY;
          el.addEventListener('mousedown', (e) => {
            if (rollLock) return;
            e.preventDefault();
            startX = e.clientX; startY = e.clientY;
            initialX = parseFloat(el.style.left) || 0;
            initialY = parseFloat(el.style.top) || 0;
            el.classList.add('dragging');
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
          });
          function onMove(e) {
            const dx = e.clientX - startX, dy = e.clientY - startY;
            let newLeft = initialX + dx, newTop = initialY + dy;
            const rect = container.getBoundingClientRect();
            const elRect = el.getBoundingClientRect();
            newLeft = Math.max(0, Math.min(newLeft, rect.width - elRect.width));
            newTop = Math.max(0, Math.min(newTop, rect.height - elRect.height));
            el.style.left = newLeft + 'px'; el.style.top = newTop + 'px';
          }
          function onUp() {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            el.classList.remove('dragging');
          }
        }
      }

      function openGroupDivision(className, presentNames, absentSetParam) {
        const saved = loadResult(className, 'group');
        let groupA, groupB;
        let isCached = false;
        if (saved && saved.groupA && saved.groupB) {
          const allSaved = [...saved.groupA, ...saved.groupB];
          const currentValid = presentNames.filter(n => !absentSetParam.has(n));
          if (allSaved.length === currentValid.length && allSaved.every(n => currentValid.includes(n))) {
            groupA = saved.groupA;
            groupB = saved.groupB;
            isCached = true;
          }
        }
        if (!isCached) {
          const validNames = presentNames.filter(n => !absentSetParam.has(n));
          const shuffled = shuffle([...validNames]);
          const half = Math.ceil(shuffled.length / 2);
          groupA = shuffled.slice(0, half);
          groupB = shuffled.slice(half);
          saveResult(className, 'group', { groupA, groupB });
        }
        showGroupPopup(groupA, groupB, className, isCached, absentSetParam);
      }

      function showGroupPopup(groupA, groupB, className, isCached, absentSetParam) {
        const overlay = document.createElement('div'); overlay.className = 'overlay';
        const popup = document.createElement('div'); popup.className = 'group-popup';
        popup.innerHTML = `
          <button class="popup-close" id="groupClose"><i class="fas fa-times"></i></button>
          <div style="text-align:center;font-weight:700;font-size:1.5rem;color:var(--accent);">
            <i class="fa-solid fa-user-group"></i> Chia nhóm
          </div>
          <div class="group-columns">
            <div class="group-col">
              <h4><i class="fa-solid fa-at"></i> Nhóm Comga</h4>
              <ul id="listA"></ul>
            </div>
            <div class="group-col">
              <h4><i class="fa-solid fa-chess-rook"></i> Nhóm Punki</h4>
              <ul id="listB"></ul>
            </div>
          </div>
          <div style="text-align:center">
            <button class="btn-reroll-tiny" id="groupReroll">
              <i class="fa-solid fa-arrows-rotate"></i> Roll lại
            </button>
          </div>
        `;
        overlay.appendChild(popup);
        document.body.appendChild(overlay);

        const listA = document.getElementById('listA');
        const listB = document.getElementById('listB');

        function addItemToList(ul, name, isFirst, animated) {
          const li = document.createElement('li');
          if (isFirst) {
            li.classList.add('first-highlight');
            li.innerHTML = `${name} <span class="leader-badge">trưởng nhóm</span>`;
          } else {
            li.textContent = name;
          }
          if (animated) li.classList.add('animated');
          ul.appendChild(li);
        }

        if (isCached) {
          groupA.forEach((name, i) => addItemToList(listA, name, i === 0, false));
          groupB.forEach((name, i) => addItemToList(listB, name, i === 0, false));
        } else {
          const maxLen = Math.max(groupA.length, groupB.length);
          for (let i = 0; i < maxLen; i++) {
            setTimeout(() => {
              if (i < groupA.length) addItemToList(listA, groupA[i], i === 0, true);
              if (i < groupB.length) addItemToList(listB, groupB[i], i === 0, true);
            }, i * 250);
          }
        }

        document.getElementById('groupClose').onclick = () => closeOverlay(overlay);
        overlay.addEventListener('click', e => { if(e.target === overlay) closeOverlay(overlay); });

        document.getElementById('groupReroll').onclick = () => {
          clearResult(className, 'group');
          closeOverlay(overlay);
          const currentPresent = classData[className].filter(n => !currentAbsentSet.has(n));
          openGroupDivision(className, currentPresent, currentAbsentSet);
        };
      }

      function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
      function getKey(cls, type) { return `comic_yattad_${cls}_${type}`; }
      function saveResult(cls, type, data) { localStorage.setItem(getKey(cls, type), JSON.stringify({ data, time: Date.now() })); }
      function loadResult(cls, type) {
        const raw = localStorage.getItem(getKey(cls, type));
        if (!raw) return null;
        try { const p = JSON.parse(raw); if (Date.now() - p.time < 3600000) return p.data; } catch (e) {}
        localStorage.removeItem(getKey(cls, type)); return null;
      }
      function clearResult(cls, type) { localStorage.removeItem(getKey(cls, type)); }

      renderClassCards();
    })();
  </script>
</body>
</html>
